name: Update AI news

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch feeds
        run: python fetch_news.py
      - name: AI enrichment (group, summarize, Top 5)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # if missing, heuristic mode is used
        run: python enrich.py
      - name: Commit updated data
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json state.json raw.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M')"
          git push
